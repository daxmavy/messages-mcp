[project]
name = "messages-mcp"
version = "0.1.0"
description = "MCP server over Max's message store (Signal, WhatsApp): read-only"
readme = "README.md"
authors = [
    { name = "Max Davy", email = "max.davy98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0,<2.4",
    "owner-mcp",
]

[project.scripts]
messages-mcp = "messages_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
owner-mcp = { git = "https://github.com/daxmavy/owner-mcp", branch = "main" }
